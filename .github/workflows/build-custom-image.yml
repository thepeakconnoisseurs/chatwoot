name: Build Custom Image

# Membangun image custom peakwine/chatwoot dari branch dev.
# Secrets yang harus di-set di repo fork (Settings → Secrets and variables → Actions):
#   - DOCKERHUB_USERNAME  : username Docker Hub (peakwine)
#   - DOCKERHUB_TOKEN     : access token Docker Hub (permission read/write)
on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: peakwine/chatwoot
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
